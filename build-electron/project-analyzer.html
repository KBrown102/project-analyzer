<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目结构分析器 · Project Analyzer</title>
<style>
  :root{
    --bg:#16181c; --panel:#1e2126; --panel2:#252930; --line:#33383f;
    --tx:#e6e8ea; --tx2:#9aa3ad; --tx3:#6b7480;
    --ok:#5DCAA5; --okbg:#0F6E56; --warn:#EF9F27; --warnbg:#633806; --miss:#3a4048;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;padding:28px 24px 60px}
  .wrap{max-width:1120px;margin:0 auto}
  h1{font-size:20px;font-weight:500;margin-bottom:6px}
  .sub{color:var(--tx2);font-size:13px;margin-bottom:24px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
  button{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--ok);color:var(--ok)}
  button.on{background:var(--okbg);border-color:var(--ok);color:#fff}
  .mode{margin-left:auto;display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:9px;border:1px solid var(--line)}
  .mode button{border:none;background:none;padding:6px 14px}
  .mode button.on{background:var(--panel2)}
  .pwrap{display:flex;align-items:center;gap:7px;background:var(--panel);padding:5px 10px;border-radius:9px;border:1px solid var(--line)}
  .pwrap label{font-size:12px;color:var(--tx3)}
  .pwrap select{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;font-family:inherit;cursor:pointer}
  .pwrap select:hover{border-color:var(--ok)}
  .ptag{display:inline-block;background:var(--okbg);border:1px solid var(--ok);color:#fff;border-radius:5px;padding:2px 8px;font-size:11px;margin:0 5px 5px 0}
  .slot{border:1px dashed var(--line);border-radius:10px;padding:13px 16px;margin-bottom:14px;color:var(--tx3);font-size:13px}
  .slot.loaded{border-style:solid;border-color:var(--ok);color:var(--tx);background:var(--panel)}
  .slot b{color:var(--tx);font-weight:500}
  .grid{display:grid;gap:16px}
  .grid.two{grid-template-columns:1fr 1fr}
  @media(max-width:860px){.grid.two{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .card.diff{border-color:var(--warn);box-shadow:0 0 0 1px rgba(239,159,39,.18)}
  .cname{font-size:16px;font-weight:500;margin-bottom:3px}
  .cmeta{color:var(--tx2);font-size:12px;margin-bottom:16px}
  .tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-size:11px;color:var(--tx2);margin:0 5px 5px 0}
  .tag.hi{border-color:var(--ok);color:var(--ok)}
  h3{font-size:13px;font-weight:500;color:var(--tx2);margin:18px 0 10px;letter-spacing:.3px}
  h3:first-child{margin-top:0}
  .phases{display:flex;gap:4px}
  .ph{flex:1;text-align:center}
  .phbox{height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;border:1px solid var(--line);background:var(--panel2);color:var(--tx3)}
  .phbox.done{background:var(--okbg);border-color:var(--ok);color:#c8f0e4}
  .phbox.cur{background:var(--warnbg);border-color:var(--warn);color:#f7d9a8}
  .phlbl{font-size:10px;color:var(--tx3);margin-top:4px}
  .row{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--miss)}
  .dot.ok{background:var(--ok)}
  .dot.no{background:transparent;border:1.5px solid var(--tx3)}
  .row span.n{color:var(--tx2)}
  .row .v{margin-left:auto;color:var(--tx3);font-size:12px}
  .gaps{margin-top:14px;padding:12px 14px;background:rgba(239,159,39,.08);border-left:2px solid var(--warn);border-radius:0 8px 8px 0;font-size:12.5px;color:#e8d3b0}
  .gaps b{color:var(--warn);font-weight:500}
  .gaps ul{margin:6px 0 0 16px}
  .gaps li{margin:2px 0}
  .empty{color:var(--tx3);font-size:13px;padding:8px 0}
  .intro{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:13px 15px}
  .ititle{font-size:15px;font-weight:500;margin-bottom:5px}
  .ibody{color:var(--tx2);font-size:12.5px;line-height:1.7}
  .isrc{color:var(--tx3);font-size:11.5px;margin-top:8px}
  .isrc b{color:var(--tx2);font-weight:500}
  .mods{margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
  .mods .row{padding:2px 0;font-size:12px}
  .adv{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 14px;margin-bottom:8px}
  .adv .ah{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
  .adv .ah b{font-weight:500;font-size:13.5px}
  .pri{font-size:10.5px;padding:1px 7px;border-radius:4px;font-weight:500;flex:none}
  .pri.P0{background:#7a2a2a;color:#ffc9c9}
  .pri.P1{background:var(--warnbg);color:#f7d9a8}
  .pri.P2{background:#2a3a4a;color:#b8d4ea}
  .pri.P3{background:var(--panel);color:var(--tx3)}
  .atag{font-size:11px;color:var(--tx3);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
  .adetail{color:var(--tx2);font-size:12.5px;line-height:1.65}
  .awhy{color:var(--tx3);font-size:11.5px;margin-top:4px}

  /* —— 项目边界提示条 —— */
  .bnd{background:var(--panel);border:1px solid var(--warn);border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .bnd.ok{border-color:var(--ok)}
  .bndt{font-size:13.5px;font-weight:500;color:var(--warn);margin-bottom:3px}
  .bnd.ok .bndt{color:var(--ok)}
  .bndd{color:var(--tx2);font-size:12.5px;margin-bottom:11px;line-height:1.65}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 13px;font-size:12.5px;cursor:pointer;transition:.12s;text-align:left}
  .chip:hover{border-color:var(--ok);color:var(--ok)}
  .chip.on{background:var(--okbg);border-color:var(--ok);color:#fff}
  .chip .cn{font-weight:500}
  .chip .ck{display:block;color:var(--tx3);font-size:11px;margin-top:2px}
  .chip.on .ck{color:#c8f0e4}
  .chip .ck b{font-weight:500;color:var(--tx2)}
  .chip.on .ck b{color:#fff}

  /* —— 建议勾选 —— */
  .adv{position:relative;padding-left:36px}
  .adv.off{opacity:.42}
  .adv .ckbox{position:absolute;left:12px;top:13px;width:15px;height:15px;cursor:pointer;accent-color:var(--ok)}

  /* —— 导出提示词 —— */
  .exp{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
  .expbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .expcount{color:var(--tx3);font-size:12px;margin-left:auto}
  .prev{background:#12141a;border:1px solid var(--line);border-radius:9px;padding:14px;margin-top:11px;
        font:12px/1.7 ui-monospace,Consolas,"Courier New",monospace;color:var(--tx2);
        max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word}
  .prev.hide{display:none}
  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--okbg);
         border:1px solid var(--ok);color:#fff;padding:9px 20px;border-radius:8px;font-size:13px;
         opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
  .toast.show{opacity:1}
  .note{color:var(--tx3);font-size:12px;margin-top:22px;line-height:1.7}
  .cmp{margin-top:18px}
  .cmp .row{border-bottom:1px solid var(--line);padding:8px 0}
  .cmp .row:last-child{border:none}
  .cmp .k{width:150px;color:var(--tx2);flex:none}
  .cmp .a,.cmp .b{flex:1;font-size:12.5px}
  .cmp .a{color:var(--tx)}
  .cmp .b{color:var(--tx)}
  .cmp .diffmark{color:var(--warn);font-size:11px;margin-left:6px}
  .head-row{display:flex;font-size:12px;color:var(--tx3);padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .head-row .k{width:150px;flex:none}
  .head-row .a,.head-row .b{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>项目结构分析器</h1>
  <div class="sub">选择本地项目目录，按 CCGS 结构（阶段 / 产物 / 工程化）自动分析并出图；加载第二个项目可并排对比。纯本地运行，文件不会上传到任何地方。</div>

  <div class="bar">
    <button id="btnA">选择项目 A</button>
    <button id="btnB">选择项目 B（对比用）</button>
    <button id="btnClear">清空</button>
    <div class="mode">
      <button id="mSingle" class="on">单项目</button>
      <button id="mCompare">对比</button>
    </div>
    <div class="pwrap">
      <label for="selProfile">分析模板</label>
      <select id="selProfile"><option value="">自动识别</option></select>
    </div>
  </div>

  <div class="slot" id="slotA">项目 A：未选择</div>
  <div class="slot" id="slotB">项目 B：未选择（对比模式需要）</div>

  <div id="out"></div>

  <div class="note">
    说明：目录读取用的是 <code>&lt;input webkitdirectory&gt;</code>，直接在本地浏览器完成，无需起服务器，也不会联网。
    会自动跳过 node_modules / .git / dist 等噪音目录；只读取文本文档的内容用于识别（最多 250 个、单个小于 300KB），二进制与大型文件只统计不读内容。
  </div>
</div>

<div id="toast" class="toast"></div>

<input type="file" id="fa" webkitdirectory directory multiple style="display:none">
<input type="file" id="fb" webkitdirectory directory multiple style="display:none">

<script>
(function(){
  "use strict";
  // 噪音目录：浏览器版和 Electron 版（build-electron/scanner.js）各有一份，
  // 两处必须完全一致，否则同一个目录两条路线会算出不同结果。
  // tests/smoke.test.mjs 会核对这个列表，改这里记得同步改那边。
  var NOISE = /(^|\/)(node_modules|\.git|\.svn|dist(-.*)?|build|win-unpacked|linux-unpacked|mac|nsis|portable|\.next|out(-.*)?|target|bin|obj|venv|__pycache__|\.idea|\.vscode|Library|Temp|Logs|release|\.cache|coverage|\.gradle|\.terraform|vendor)(\/|$)/;
  var TEXT_RE = /\.(md|markdown|json|ya?ml|txt|lua|js|mjs|cjs|py|gd|cs|ts|html|css|sh|toml|ini|cfg)$/i;
  var MAX_TEXTS = 250, MAX_SIZE = 300 * 1024;
  // 浏览器版：浏览器会先把目录下所有文件枚举完才交给我们，数量太大时先提醒用户
  var WARN_FILES = 8000;    // 超过这个数给提示
  var HARD_FILES = 40000;   // 超过这个数强烈建议换 exe 版

  var A = null, B = null, mode = "single";
  var CACHE = {};
  // 当前分析到哪一层：null = 整个目录，否则是子项目路径
  var SCOPE = { A:null, B:null };
  // 浏览器交给我们的原始文件数（过滤噪音之前），用于提示规模
  var RAW_COUNT = { A:0, B:0 };

  var RE_TEST = /(^|\/)(test|tests|spec|__tests__)\/|\.(test|spec)\.|test-strategy/i;
  var RE_CI   = /\.github\/workflows|gitlab-ci|\.gitlab-ci|azure-pipelines|Jenkinsfile/i;
  var RE_DOC  = /README/i;
  var RE_SRC  = /\.(js|mjs|cjs|jsx|ts|tsx|py|java|kt|cs|rs|go|rb|php|c|cpp|h|lua|gd|swift)$/i;

  // —— 分析模板：项目形态不同，该问的问题也不同 ——
  var PROFILES = {
    game: {
      id:"game", name:"游戏项目", tag:"CCGS 八阶段",
      phases:[
        { id:0, name:"诊断",   re:/STUDIO_OVERVIEW|诊断|audit|现状盘点|复盘/i },
        { id:1, name:"概念",   re:/concept|概念|pitch|立项/i },
        { id:2, name:"系统设计", re:/gdd|系统设计/i },
        { id:3, name:"技术搭建", re:/architect|adr|架构|技术方案/i },
        { id:4, name:"预制作", re:/ux-spec|ux[_-]?design|art-bible|asset-spec|epics|预[制製]作|原型/i },
        { id:5, name:"制作",   re:/sprint|production\/|src\//i },
        { id:6, name:"打磨",   re:/balance|perf|polish|打磨|优化报告|playtest/i },
        { id:7, name:"发布",   re:/release|changelog|launch|发布|部署/i }
      ],
      artifacts:[
        { key:"GDD",  label:"设计文档 GDD", re:/design\/gdd\/.+\.md$|gdd/i },
        { key:"ADR",  label:"架构决策 ADR", re:/adr/i },
        { key:"ARCH", label:"架构文档",     re:/architect/i },
        { key:"UX",   label:"UX 规范",      re:/ux-spec|ux[_-]?design/i },
        { key:"ART",  label:"美术规范",     re:/art-bible|asset-spec|art\//i },
        { key:"PLAN", label:"迭代 / 冲刺计划", re:/sprint|epics|roadmap|计划/i },
        { key:"TEST", label:"测试",         re:RE_TEST },
        { key:"CI",   label:"CI 配置",      re:RE_CI },
        { key:"DOC",  label:"说明文档",     re:RE_DOC }
      ],
      advice: adviceGame
    },

    web: {
      id:"web", name:"Web 应用", tag:"需求到部署",
      phases:[
        { id:0, name:"需求",   re:/requirement|需求|prd|产品需求/i },
        { id:1, name:"设计",   re:/(^|\/)design\/|原型|wireframe|ui-spec|设计稿/i },
        { id:2, name:"实现",   re:/src\/|components?\/|pages?\/|views?\/|app\//i },
        { id:3, name:"构建部署", re:/deploy|Dockerfile|vercel|netlify|nginx|workflows/i },
        { id:4, name:"监控迭代", re:/monitor|sentry|analytics|埋点|CHANGELOG|迭代/i }
      ],
      artifacts:[
        { key:"README", label:"README",     re:RE_DOC },
        { key:"ENV",    label:"环境变量示例", re:/\.env\.(example|sample)/i },
        { key:"API",    label:"接口文档",    re:/api\.(md|ya?ml|json)$|swagger|openapi/i },
        { key:"STYLE",  label:"样式规范",    re:/style-guide|design-token|tailwind\.config|theme\./i },
        { key:"DEPLOY", label:"部署配置",    re:/Dockerfile|docker-compose|vercel\.json|netlify\.toml|\.github\/workflows/i },
        { key:"TEST",   label:"测试",        re:RE_TEST },
        { key:"CI",     label:"CI 配置",     re:RE_CI }
      ],
      advice: adviceWeb
    },

    server: {
      id:"server", name:"后端服务", tag:"能跑到能上线",
      phases:[
        { id:0, name:"能跑",     re:/(^|\/)(server|app|main|index|manage)\.(js|ts|py|go|rb|php)$|(^|\/)cmd\/[^/]+\.go$|(^|\/)(Application|Program)\.(java|cs)$/i },
        { id:1, name:"接口层",   re:/(^|\/)(routes?|routers?|controllers?|handlers?|endpoints?|api)\//i },
        { id:2, name:"数据层",   re:/(^|\/)(models?|entities?|repositor(y|ies)|dao|migrations?|prisma)\/|schema\.(prisma|sql)$|alembic/i },
        { id:3, name:"配置环境", re:/\.env\.(example|sample|template)|application\.(yml|yaml|properties)|(^|\/)(config|conf|settings)\//i },
        { id:4, name:"质量保障", re:/(^|\/)(tests?|spec)\/|(^|\/)(middleware|exceptions?|errors?|logger|logging)\//i },
        { id:5, name:"交付上线", re:/Dockerfile|docker-compose|health|readiness|liveness|actuator|\.github\/workflows/i }
      ],
      artifacts:[
        { key:"README",  label:"README",        re:RE_DOC },
        { key:"ENV",     label:"环境变量示例",   re:/\.env\.(example|sample|template)/i },
        { key:"CONFIG",  label:"配置文件",       re:/application\.(yml|yaml|properties|toml)|(^|\/)(config|conf|settings)\//i },
        { key:"API",     label:"API 文档",       re:/swagger|openapi|api\.(md|ya?ml|json)$|(^|\/)docs\/api/i },
        { key:"MIGRATE", label:"数据迁移",       re:/(^|\/)(migrations?|prisma)\/|schema\.(prisma|sql)$|alembic/i },
        { key:"AUTH",    label:"鉴权",           re:/(^|\/)(auth|guard|permission|security)\/|middleware/i },
        { key:"ERR",     label:"统一错误处理",    re:/(^|\/)(errors?|exceptions?)\/|error[_-]?handler/i },
        { key:"LOG",     label:"日志",           re:/(^|\/)(logs?|logger|logging)\/|winston|logrus|zap|log4j|loguru/i },
        { key:"DOCKER",  label:"容器化",         re:/Dockerfile|docker-compose|\.dockerignore/i },
        { key:"HEALTH",  label:"健康检查",       re:/health|readiness|liveness|actuator/i },
        { key:"TEST",    label:"测试",           re:RE_TEST },
        { key:"CI",      label:"CI 配置",        re:RE_CI }
      ],
      advice: adviceServer
    },

    lib: {
      id:"lib", name:"库 / SDK", tag:"接口到发布",
      phases:[
        { id:0, name:"接口设计", re:/api|interface|\.d\.ts|类型定义/i },
        { id:1, name:"实现",     re:/src\/|lib\//i },
        { id:2, name:"文档",     re:/README|docs\/|\.md$/i },
        { id:3, name:"示例",     re:/example|demo|samples/i },
        { id:4, name:"发布",     re:/CHANGELOG|release|\.npmignore|publish/i }
      ],
      artifacts:[
        { key:"README",    label:"README",     re:RE_DOC },
        { key:"LICENSE",   label:"开源协议",    re:/LICENSE/i },
        { key:"CHANGELOG", label:"变更日志",    re:/CHANGELOG/i },
        { key:"API",       label:"API 文档",    re:/api\.(md|ya?ml|json)$|docs\/api|typedoc|jsdoc/i },
        { key:"TYPE",      label:"类型定义",    re:/\.d\.ts$|types\//i },
        { key:"EXAMPLE",   label:"示例 / demo", re:/example|demo|samples/i },
        { key:"TEST",      label:"测试",        re:RE_TEST },
        { key:"CI",        label:"CI 配置",     re:RE_CI }
      ],
      advice: adviceLib
    },

    mini: {
      id:"mini", name:"小游戏 / 单文件作品", tag:"入口到闭环",
      phases:[
        { id:0, name:"入口", re:/(^|\/)index\.html$/i },
        { id:1, name:"说明", tre:/怎么玩|玩法|操作说明|点击.*开始|拖动/i },
        { id:2, name:"闭环", tre:/gameover|gameOver|结算|结束页|再来一次|重新开始|result/i },
        { id:3, name:"分发", re:/manifest\.json|README/i }
      ],
      artifacts:[
        { key:"ENTRY", label:"入口 index.html", re:/(^|\/)index\.html$/i },
        { key:"INTRO", label:"开始页说明",      tre:/怎么玩|玩法|操作说明|点击.*开始|拖动/i },
        { key:"LOOP",  label:"体验闭环",        tre:/gameover|gameOver|结算|结束页|再来一次|重新开始|result/i },
        { key:"SELF",  label:"零外部依赖",      tre:/https?:\/\/(cdn|unpkg|jsdelivr|cdnjs|fonts\.googleapis)/i, neg:true },
        { key:"PERF",  label:"帧率控制",        tre:/requestAnimationFrame/i },
        { key:"RESP",  label:"移动端适配",      re:/viewport/i, tre:/viewport|touchstart|pointerdown/i }
      ],
      advice: adviceMini
    },

    tool: {
      id:"tool", name:"内部工具", tag:"可用到分发",
      phases:[
        { id:0, name:"能用",   re:/\.(html|js|mjs|cjs|py|sh|bat)$/i },
        { id:1, name:"说明",   re:/README|使用说明|用法|usage/i },
        { id:2, name:"分发",   re:/\.(bat|sh|exe)$|package\.json|Makefile/i }
      ],
      artifacts:[
        { key:"README", label:"README",   re:RE_DOC },
        { key:"USAGE",  label:"使用说明",  re:/README|usage|使用说明|用法/i },
        { key:"LAUNCH", label:"启动脚本",  re:/\.(bat|sh)$/i },
        { key:"CONFIG", label:"配置说明",  re:/config|配置|\.env/i },
        { key:"TEST",   label:"测试",      re:RE_TEST },
        { key:"CI",     label:"CI 配置",   re:RE_CI }
      ],
      advice: adviceTool
    },

    meta: {
      id:"meta", name:"元项目 / 规则库", tag:"约定到自检",
      phases:[
        { id:0, name:"总览",   re:/README|OVERVIEW|总览|概览/i },
        { id:1, name:"约定",   re:/(^|\/)(rules|规范|约定)\/|结构约定|CONVENTIONS|约定文档/i },
        { id:2, name:"内容资产", re:/(^|\/)(references|docs|knowledge|design|resources|sources)\//i },
        { id:3, name:"工具化", re:/(^|\/)(tools|scripts)\/|\.(cjs|mjs)$/i },
        { id:4, name:"自检",   re:/(^|\/)(tests|test)\/|audit|smoke|check|lint|校验/i }
      ],
      artifacts:[
        { key:"README",   label:"README",     re:RE_DOC },
        { key:"OVERVIEW", label:"项目总览",    re:/OVERVIEW|总览|概览|PROJECT_OVERVIEW/i },
        { key:"CONV",     label:"约定文档",    re:/约定|CONVENTIONS|(^|\/)rules\/|规范/i },
        { key:"INDEX",    label:"索引 / 目录", re:/INDEX|索引|目录\.md|README\.md$/i },
        { key:"TOOL",     label:"工具脚本",    re:/(^|\/)(tools|scripts)\/|\.(cjs|mjs)$/i },
        { key:"TEST",     label:"自检脚本",    re:/(^|\/)(tests|test)\/|audit|smoke|check/i },
        { key:"CI",       label:"CI 配置",     re:RE_CI }
      ],
      advice: adviceMeta
    },

    generic: {
      id:"generic", name:"通用项目", tag:"基础工程化",
      phases:[
        { id:0, name:"说明",   re:/README/i },
        { id:1, name:"源码",   re:RE_SRC },
        { id:2, name:"工程化", re:RE_CI },
        { id:3, name:"发布",   re:/LICENSE|CHANGELOG|release/i }
      ],
      artifacts:[
        { key:"README",  label:"README",   re:RE_DOC },
        { key:"LICENSE", label:"开源协议",  re:/LICENSE/i },
        { key:"TEST",    label:"测试",      re:RE_TEST },
        { key:"CI",      label:"CI 配置",   re:RE_CI }
      ],
      advice: adviceGeneric
    }
  };

  var PROFILE_ORDER = ["game","web","server","lib","mini","tool","meta","generic"];

  function getProfile(id){ return PROFILES[id] || PROFILES.generic; }

  function anyPath(paths, re){ for (var i=0;i<paths.length;i++){ if (re.test(paths[i])) return paths[i]; } return null; }
  function countPath(paths, re){ var n=0; for (var i=0;i<paths.length;i++){ if (re.test(paths[i])) n++; } return n; }

  function detectType(paths, texts){
    var joined = texts.map(function(t){ return t.path + " " + t.text.slice(0, 400); }).join("\n").slice(0, 40000);
    if (anyPath(paths, /project\.godot$/)) return "Godot 游戏";
    if (anyPath(paths, /conf\.lua$/) && anyPath(paths, /main\.lua$/)) return "LÖVE 2D 游戏";
    if (anyPath(paths, /ProjectSettings\//) || anyPath(paths, /\.unity$/)) return "Unity 项目";
    if (anyPath(paths, /\.uproject$/)) return "Unreal 项目";
    if (anyPath(paths, /(^|\/)\.claude\//)) return "Claude Code 项目";

    // 规则 / 文档仓库：md 占多数且源码极少（要排在 Python / Node 之前判断）
    var _n = paths.length || 1;
    if (countPath(paths, /\.md$/i) / _n > 0.35 &&
        countPath(paths, RE_SRC) / _n < 0.15 &&
        countPath(paths, /\.md$/i) >= 3) return "规则 / 文档仓库";

    if (anyPath(paths, /(^|\/)index\.html$/)) {
      return /canvas|requestAnimationFrame|game|游戏/i.test(joined) ? "HTML5 网页项目" : "静态网站";
    }
    if (anyPath(paths, /package\.json$/)) {
      if (/three|canvas|phaser|pixi/i.test(joined)) return "Web 游戏工程";
      // 有后端框架特征、无前端页面信号 → 这是服务端，而不是「前端工程」
      if (!hasFrontendSignal(paths) && serverScore(paths, texts) >= 3) return "Node 后端服务";
      if (anyPath(paths, /\.(tsx|jsx|vue|svelte)$/i) ||
          anyPath(paths, /(^|\/)(pages|views|components|styles|public)\//i)) return "Node / 前端工程";
      return "Node 工程";
    }
    if (anyPath(paths, /requirements\.txt$|pyproject\.toml$|\.py$/)) return "Python 项目";
    // Android 单独认，免得 Spring Boot 这类后端被叫成「Android 项目」
    if (anyPath(paths, /AndroidManifest\.xml$|(^|\/)android\//i)) return "Android 项目";
    if (anyPath(paths, /\.java$|\.gradle$|pom\.xml$/)) return "Java 项目";
    if (anyPath(paths, /\.rs$|Cargo\.toml$/)) return "Rust 项目";
    if (anyPath(paths, /go\.mod$/)) return "Go 项目";
    if (anyPath(paths, /\.csproj$|\.sln$/)) return ".NET 项目";
    if (anyPath(paths, /composer\.json$|\.php$/)) return "PHP 项目";
    if (anyPath(paths, /Gemfile$|\.rb$/)) return "Ruby 项目";
    return "未识别类型";
  }

  // —— 后端服务信号打分 ——
  // 前后端都可能有 src/ 和 package.json，所以既看依赖也看目录，两边都要有证据。
  // 注意：.java / .go / .xml 不在 TEXT_RE 里，内容读不到，这些技术栈只能靠路径判断。
  function serverScore(paths, texts){
    var s = 0;

    // 依赖清单里的后端框架（Node / Python 系能读到内容）
    var joined = texts.slice(0, 60).map(function(t){ return t.text; }).join("\n").slice(0, 30000);
    if (/express|koa|@nestjs|nestjs|fastify|hapi|socket\.io|fastapi|django|flask|tornado|sanic|celery/i.test(joined)) s += 3;
    // serverless / BaaS 也算服务端
    if (/"serverless"|serverless\.yml|vercel\.json.*functions|firebase-functions/i.test(joined)) s += 2;

    // 服务端分层目录
    if (anyPath(paths, /(^|\/)(controllers?|handlers?|repositor(y|ies)|services?|middleware|migrations?)\//i)) s += 2;
    if (anyPath(paths, /(^|\/)(routes?|routers?)\//i)) s += 2;
    // 数据层
    if (anyPath(paths, /(^|\/)(models?|entities?|dao)\//i) || anyPath(paths, /schema\.(prisma|sql)$/i)) s += 1;
    // 服务端典型配置与入口
    if (anyPath(paths, /application\.(yml|yaml|properties)$/i)) s += 2;
    if (anyPath(paths, /(^|\/)(server|manage)\.(js|ts|py)$|(^|\/)cmd\/[^/]+\.go$/i)) s += 1;
    if (anyPath(paths, /Dockerfile|docker-compose/i)) s += 1;

    // Java / Go 系：源码内容读不到，靠构建文件 + 标准目录结构认
    if (anyPath(paths, /pom\.xml$|build\.gradle$/i) && anyPath(paths, /(^|\/)src\/main\/java\//i)) s += 3;
    if (anyPath(paths, /(^|\/)go\.mod$/i) && anyPath(paths, /(^|\/)(cmd|internal|pkg)\//i)) s += 3;
    if (anyPath(paths, /\.(csproj|sln)$/i) && anyPath(paths, /(^|\/)(Controllers?|Startup|Program)\.cs$/i)) s += 3;

    return s;
  }

  // 强前端信号：有这些就不该判成后端（全栈项目归 Web 应用）
  function hasFrontendSignal(paths){
    return !!anyPath(paths, /\.(tsx|jsx|vue|svelte)$/i) ||
           !!anyPath(paths, /(^|\/)(pages|views|components|styles|public)\//i);
  }

  // —— 判断该用哪套模板 ——
  function detectProfile(paths, texts, type){
    var n = paths.length || 1;
    var mdN  = countPath(paths, /\.md$/i);
    var srcN = countPath(paths, RE_SRC);
    var mdR  = mdN / n, srcR = srcN / n;

    if (/Godot|LÖVE|Unity|Unreal|游戏/i.test(type)) return "game";

    // 元项目 / 规则库：文档为主、源码极少
    if (mdR > 0.35 && srcR < 0.15 && mdN >= 3) return "meta";

    // 小游戏 / 单文件交互作品：文件少、入口是 index.html、没有设计文档体系
    var noDesign = !anyPath(paths, /(^|\/)(gdd|design|production|art)\//i);
    if (paths.length <= 14 && noDesign && anyPath(paths, /(^|\/)index\.html$/i)){
      var idxTxt = "";
      for (var j=0;j<texts.length;j++){
        if (/(^|\/)index\.html$/i.test(texts[j].path)){ idxTxt = texts[j].text; break; }
      }
      if (/canvas|requestAnimationFrame|game|游戏|互动|动画/i.test(idxTxt)) return "mini";
      if (/game/i.test(paths.join(" "))) return "mini";
      if (paths.length <= 6) return "mini";
    }

    // 后端服务：必须排在 tool / lib / web 之前——
    // 后端项目文件往往不多，容易被 tool 抢走；而 web 的判定里含 routes/，
    // Express 这类项目会被误判成前端应用。
    if (!hasFrontendSignal(paths) && serverScore(paths, texts) >= 3) return "server";

    // 内部工具：文件很少，或就一两个 html / 脚本
    var singleHtml = paths.length <= 5 && anyPath(paths, /(^|\/)[^/]+\.html$/);
    if (singleHtml || (paths.length <= 12 && srcR < 0.5 && mdN < 8)) return "tool";

    // 库 / SDK：根级 package.json 暴露了入口或类型，且没有页面目录
    // 只认根级（root/package.json），子目录里的打包配置不算数
    var isLib = false;
    for (var i=0;i<texts.length;i++){
      if (!/package\.json$/i.test(texts[i].path)) continue;
      if (texts[i].path.split("/").length > 2) continue;
      try {
        var pk = JSON.parse(texts[i].text);
        if (pk.main || pk.exports || pk.types || pk.typings) isLib = true;
      } catch(e){}
      break;
    }
    if (isLib && !anyPath(paths, /(^|\/)(pages|views|routes|public)\//i)) return "lib";

    // Web 应用：必须有页面结构或前端框架特征。
    // 只凭 detectType 里的 "Node" 不够——Electron 工具、CLI 也会有 package.json。
    if (anyPath(paths, /(^|\/)(pages|views|routes|public)\//i)) return "web";
    if (anyPath(paths, /\.(tsx|jsx|vue|svelte)$/i)) return "web";
    // 注意：assets/ 不能当 Web 特征，桌面工具的图标也放这里
    if (/HTML5|静态网站|前端/i.test(type) && anyPath(paths, /(^|\/)(components|styles|static)\//i)) return "web";

    // 内部工具：带 bat / sh 启动脚本的桌面或命令行工具
    if (anyPath(paths, /\.(bat|sh)$/i) && !anyPath(paths, /(^|\/)(pages|views|routes)\//i)) return "tool";

    if (/Python|Java|Rust/i.test(type)) return srcN > 8 ? "lib" : "tool";
    return "generic";
  }

  // 在 html 正文里找证据（用于「有没有结束页」这类只能看内容的问题）
  function anyText(texts, tre){
    for (var i=0;i<texts.length;i++){
      if (/\.html?$/i.test(texts[i].path) && tre.test(texts[i].text)) return texts[i].path;
    }
    return null;
  }

  function detectPhases(paths, prof, texts){
    var res = prof.phases.map(function(p){
      var ev = p.re ? anyPath(paths, p.re) : null;
      if (!ev && p.tre && texts) ev = anyText(texts, p.tre);
      return { id:p.id, name:p.name, done: !!ev, evidence: ev };
    });
    // 当前阶段 = 最后一个已完成阶段的下一个
    var lastDone = -1;
    for (var i=0;i<res.length;i++){ if (res[i].done) lastDone = i; }
    var cur = (lastDone + 1 < res.length) ? (lastDone + 1) : -1;
    // 第一个未完成的若前面已完成，则标记为"进行中"
    res.forEach(function(r, i){ r.cur = (i === cur && lastDone >= 0); });
    return { list: res, lastDone: lastDone, cur: cur };
  }

  function detectArtifacts(paths, prof, texts){
    return prof.artifacts.map(function(a){
      var ev = a.re ? anyPath(paths, a.re) : null;
      var n  = a.re ? countPath(paths, a.re) : 0;
      if (a.tre && texts){
        var tv = anyText(texts, a.tre);
        if (tv){ ev = ev || tv; n = n || 1; }
      }
      // neg：命中代表「不该有的东西出现了」，所以命中即缺失
      var has = a.neg ? !ev : !!ev;
      return { key:a.key, label:a.label, has: has, count:n, evidence: ev };
    });
  }

  function detectEngineering(paths, texts){
    var pkg = null;
    for (var i=0;i<texts.length;i++){
      if (/package\.json$/.test(texts[i].path)) { try { pkg = JSON.parse(texts[i].text); } catch(e){} break; }
    }
    return {
      ci: !!anyPath(paths, /\.github\/workflows|gitlab-ci|Jenkinsfile/i),
      test: countPath(paths, /(^|\/)(test|tests|spec|__tests__)\/|\.(test|spec)\./i),
      pkg: !!pkg,
      scripts: pkg && pkg.scripts ? Object.keys(pkg.scripts) : [],
      deps: pkg ? Object.keys(pkg.dependencies||{}).length : 0,
      readme: !!anyPath(paths, /README/i),
      license: !!anyPath(paths, /LICENSE/i)
    };
  }

  // —— 项目边界：选的这一层到底是不是一个项目？还是个装着好几个项目的工作区？——
  // 判定靠「项目标志物」：有 manifest 的目录基本可以认定是独立项目。
  var MANIFEST = [
    { re:/(^|\/)package\.json$/i,                          kind:"Node / 前端", w:3 },
    { re:/(^|\/)(pyproject\.toml|setup\.py|Pipfile)$/i,    kind:"Python",      w:3 },
    { re:/(^|\/)Cargo\.toml$/i,                            kind:"Rust",        w:3 },
    { re:/(^|\/)go\.mod$/i,                                kind:"Go",          w:3 },
    { re:/(^|\/)(pom\.xml|build\.gradle)$/i,               kind:"Java",        w:3 },
    // 这两个是扩展名，前面还有项目名，不能要求紧跟分隔符
    { re:/\.(sln|csproj|fsproj|vbproj)$/i,                 kind:".NET",        w:3 },
    { re:/(^|\/)project\.godot$/i,                         kind:"Godot",       w:3 },
    { re:/\.uproject$/i,                                   kind:"Unreal",      w:3 },
    { re:/(^|\/)(composer\.json|Gemfile|mix\.exs|deno\.json)$/i, kind:"其他",   w:3 },
    { re:/(^|\/)requirements\.txt$/i,                      kind:"Python",      w:2 },
    { re:/(^|\/)conf\.lua$/i,                              kind:"LÖVE 2D",     w:2 },
    // 单文件网页作品也是项目，配合 README 就能过线
    { re:/(^|\/)index\.html$/i,                            kind:"网页 / 单文件", w:2 }
  ];
  // 低于这个分不认为是项目
  var PROJECT_MIN = 3;

  function scoreDir(files){
    var score = 0, kind = null, ev = null;
    for (var i=0;i<MANIFEST.length;i++){
      var hit = anyPath(files, MANIFEST[i].re);
      if (hit){ score += MANIFEST[i].w; kind = MANIFEST[i].kind; ev = hit; break; }
    }
    var srcN = countPath(files, RE_SRC);
    if (anyPath(files, /(^|\/)(src|lib|app|cmd|internal)\//i)) score += 2;
    else if (srcN >= 3) score += 2;
    else if (srcN >= 1) score += 1;
    if (anyPath(files, /README/i)) score += 1;
    return { score: score, kind: kind, evidence: ev, files: files.length };
  }

  function detectProjects(paths){
    var root = paths.length ? paths[0].split("/")[0] : null;
    if (!root) return { isSingle:false, root:null, top:null, projects:[], reason:"空目录" };

    // 顶层自己的文件（不含子目录里的）
    var topFiles = paths.filter(function(p){ return p.split("/").length === 2; });
    var top = scoreDir(topFiles);
    if (top.score >= PROJECT_MIN){
      return { isSingle:true, root:root, top:top, projects:[],
               reason:"顶层有项目标志物" + (top.evidence ? "：" + top.evidence.split("/").pop() : "") };
    }

    // 顶层不像项目，往下扫一层
    var groups = {};
    paths.forEach(function(p){
      var seg = p.split("/");
      if (seg.length < 3) return;
      var key = seg[0] + "/" + seg[1];
      (groups[key] = groups[key] || []).push(p);
    });

    var projects = [];
    Object.keys(groups).forEach(function(k){
      var s = scoreDir(groups[k]);
      if (s.score >= PROJECT_MIN){
        projects.push({ path:k, name:k.split("/")[1], kind:s.kind || "未识别",
                        files:groups[k].length, score:s.score, evidence:s.evidence });
      }
    });
    projects.sort(function(a,b){ return b.score - a.score || b.files - a.files; });

    return { isSingle:false, root:root, top:top, projects:projects,
             reason: projects.length
               ? "顶层不像单个项目，子目录里找到 " + projects.length + " 个候选"
               : "没找到项目标志物，这一层可能只是普通文件夹" };
  }

  function topExt(paths, n){
    var m = {};
    paths.forEach(function(p){
      var ext = (p.split(".").pop() || "").toLowerCase();
      if (ext && ext.length < 6) m[ext] = (m[ext]||0)+1;
    });
    return Object.keys(m).map(function(k){ return {ext:k, n:m[k]}; })
      .sort(function(a,b){ return b.n - a.n; }).slice(0, n);
  }

  function readOne(f){
    if (typeof f.text === "function") return f.text();
    return new Promise(function(res, rej){
      var r = new FileReader();
      r.onload = function(){ res(String(r.result)); };
      r.onerror = rej;
      r.readAsText(f);
    });
  }

  function readTexts(files){
    var targets = files.filter(function(f){
      return TEXT_RE.test(f.name) && f.size < MAX_SIZE;
    }).slice(0, MAX_TEXTS);
    var out = [];
    return targets.reduce(function(chain, f){
      return chain.then(function(){
        return readOne(f).then(function(t){
          out.push({ path:f.webkitRelativePath.replace(/\\/g,"/"), text:t });
        }).catch(function(){});
      });
    }, Promise.resolve()).then(function(){ return out; });
  }

  // 核心入口：手里已经有 {paths, texts} 就直接算。
  // 浏览器（webkitdirectory）和 Electron（fs 扫描）两条路都汇到这里，
  // 后面的分析逻辑完全一样，只有数据来源不同。
  // paths 里第一段必须是根目录名，例如 "antgame/src/main.js"
  function analyzeEntries(entries, label, profileId){
    var paths = entries && entries.paths || [];
    if (!paths.length) return Promise.resolve(null);
    CACHE[label] = {
      paths: paths,
      texts: (entries && entries.texts) || [],
      root: paths[0].split("/")[0],
      fileCount: paths.length,
      boundary: detectProjects(paths),
      source: (entries && entries.source) || "unknown",
      truncated: !!(entries && entries.truncated)
    };
    return Promise.resolve(buildData(label, profileId));
  }

  // 浏览器入口：先按 NOISE 过滤，再读文本内容
  function analyze(fileList, label, profileId){
    var files = Array.prototype.slice.call(fileList)
      .filter(function(f){ return !NOISE.test(f.webkitRelativePath.replace(/\\/g,"/")); });
    if (!files.length) return Promise.resolve(null);
    return readTexts(files).then(function(texts){
      return analyzeEntries({
        paths: files.map(function(f){ return f.webkitRelativePath.replace(/\\/g,"/"); }),
        texts: texts,
        source: "browser"
      }, label, profileId);
    });
  }

  // Electron 入口：原生对话框选路径，主进程扫完把结果送进来。
  // 没有 Electron 环境时 HAS_NATIVE 为 false，UI 会自动退回 input 方式。
  var NATIVE = (typeof window !== "undefined" && window.electronAPI) || null;
  var HAS_NATIVE = !!(NATIVE && NATIVE.openFolder && NATIVE.scan);

  function analyzeNative(label, profileId){
    if (!HAS_NATIVE) return Promise.resolve(null);
    return NATIVE.openFolder().then(function(root){
      if (!root) return null;
      return NATIVE.scan(root).then(function(entries){
        if (!entries || !entries.paths || !entries.paths.length) return null;
        return analyzeEntries({
          paths: entries.paths,
          texts: entries.texts || [],
          source: "electron",
          truncated: entries.truncated
        }, label, profileId);
      });
    });
  }

  // 换模板 / 切换子项目时不用重读文件，直接按原数据重算
  // scope 传子目录路径（如 "workspace/antgame"）就只分析那一棵
  function buildData(label, profileId, scope){
    var c = CACHE[label];
    if (!c) return null;
    var paths = c.paths, texts = c.texts;
    if (scope){
      var pre = scope + "/";
      var fp = paths.filter(function(p){ return p.indexOf(pre) === 0; });
      var ft = texts.filter(function(t){ return t.path.indexOf(pre) === 0; });
      if (!fp.length) return null;
      paths = fp; texts = ft;
    }
    var type = detectType(paths, texts);
    var auto = detectProfile(paths, texts, type);
    var pid  = profileId || auto;
    var prof = getProfile(pid);
    var name = scope ? scope.split("/").pop() : c.root;

    var d = {
      label: label,
      root: c.root,
      name: name,
      scope: scope || null,
      files: paths.length,
      dirs: new Set(paths.map(function(p){ return p.split("/").slice(0,-1).join("/"); })).size,
      exts: topExt(paths, 5),
      profile: prof.id,
      profileName: prof.name,
      profileTag: prof.tag,
      auto: auto,
      type: type,
      source: c.source || "browser",
      truncated: !!c.truncated,
      boundary: c.boundary || null,
      phases: detectPhases(paths, prof, texts),
      artifacts: detectArtifacts(paths, prof, texts),
      eng: detectEngineering(paths, texts)
    };
    d.has = {};
    d.artifacts.forEach(function(a){ d.has[a.key] = a.has; });
    d.intro = genIntro(paths, texts, type);
    d.advice = prof.advice(d);
    return d;
  }

  // —— 目录名 → 用途（用于无文档时从结构推断项目在干什么）——
  var DIR_MEANING = {
    design:"设计文档", docs:"技术文档", gdd:"系统设计", adr:"架构决策记录",
    src:"源码", lib:"本地库", assets:"资源素材", art:"美术规范",
    production:"项目管理", test:"测试", tests:"测试", spec:"测试", scripts:"脚本",

  function inferModules(paths){
    var seen = {};
    paths.forEach(function(p){
      var seg = p.split("/");
      for (var i=1;i<seg.length-1;i++){
        var d = seg[i].toLowerCase();
        if (DIR_MEANING[d] && !seen[d]) seen[d] = { dir: seg.slice(0, i+1).join("/"), mean: DIR_MEANING[d], n: 0 };
        if (seen[d]) seen[d].n++;
      }
    });
    return Object.keys(seen).map(function(k){ return seen[k]; })
      .sort(function(a,b){ return b.n - a.n; }).slice(0, 6);
  }

  // —— 项目介绍：有文档读文档，没文档靠代码推断 ——
  function genIntro(paths, texts, type){
    var doc = null;
    var order = [/STUDIO_OVERVIEW/i, /OVERVIEW/i, /^README/i, /README/i, /concept/i, /简介/i, /ABOUT/i];
    for (var oi=0; oi<order.length && !doc; oi++){
      for (var i=0;i<texts.length;i++){
        if (order[oi].test(texts[i].path) && texts[i].text.length > 60){ doc = texts[i]; break; }
      }
    }

    var title = "", body = "", fromDoc = false, srcName = "";
    if (doc){
      fromDoc = true;
      srcName = doc.path.split("/").pop();
      var m = /^#\s+(.+)$/m.exec(doc.text);
      if (m) title = m[1].replace(/[#*`]/g, "").trim();
      var lines = doc.text.split(/\r?\n/), buf = [], collecting = false;
      for (var li=0; li<lines.length; li++){
        var ln = lines[li].trim();
        if (li < 6 && /^---$/.test(ln)) continue;
        if (!collecting){ if (/^#\s+/.test(ln)) collecting = true; continue; }
        if (/^#{1,6}\s/.test(ln) || /^```/.test(ln) || /^\|/.test(ln) || /^---/.test(ln) || /^!\[/.test(ln)){
          if (buf.length >= 2) break; else continue;
        }
        if (ln) buf.push(ln.replace(/[>*`]/g, "").trim());
        if (buf.join("").length > 240) break;
      }
      body = buf.join(" ").slice(0, 240);
    }

    // 技术栈（从文件类型与依赖推断）
    var tech = [];
    if (anyPath(paths, /\.html?$/i)) tech.push("HTML");
    if (anyPath(paths, /\.css$/i)) tech.push("CSS");
    if (anyPath(paths, /\.(js|mjs|cjs)$/i)) tech.push("JavaScript");
    if (anyPath(paths, /\.tsx?$/i)) tech.push("TypeScript");
    if (anyPath(paths, /\.lua$/i)) tech.push("Lua");
    if (anyPath(paths, /\.py$/i)) tech.push("Python");
    if (anyPath(paths, /\.java$/i)) tech.push("Java");
    if (anyPath(paths, /\.rs$/i)) tech.push("Rust");
    if (anyPath(paths, /\.cs$/i)) tech.push("C#");
    if (anyPath(paths, /three|pixi|phaser|babylon/i)) tech.push("WebGL 引擎");
    if (anyPath(paths, /react|vue|svelte/i)) tech.push("前端框架");
    if (anyPath(paths, /\.gd$/i)) tech.push("GDScript");

    // 无文档时，从 package.json / 入口文件补线索
    var infer = "";
    if (!fromDoc){
      for (var pi=0; pi<texts.length; pi++){
        if (/package\.json$/i.test(texts[pi].path)){
          try {
            var pk = JSON.parse(texts[pi].text);
            if (pk.description) infer = String(pk.description);
            if (!title && pk.name) title = String(pk.name);
          } catch(e){}
          break;
        }
      }
      if (!infer){
        for (var hi=0; hi<texts.length; hi++){
          if (/index\.html$/i.test(texts[hi].path)){
            var tm = /<title>([^<]+)<\/title>/i.exec(texts[hi].text);
            if (tm){ infer = "网页标题为「" + tm[1].trim() + "」"; if (!title) title = tm[1].trim(); }
            break;
          }
        }
      }
    }

    return {
      title: title || "（未识别到项目名）",
      body: body || infer || "",
      fromDoc: fromDoc,
      source: srcName,
      tech: tech,
      modules: inferModules(paths)
    };
  }

      detail:"OpenAPI / Swagger 描述，或 docs/api.md 列出所有端点与出入参",
      why:"接口靠口头对接，一改就断，联调成本全花在猜上。" });
    if (!hasA.MIGRATE) adv.push({ pri:"P2", tag:"数据", title:"补数据迁移",
      detail:"migrations/ 或 schema.prisma：建表与变更脚本，能从零重放",
      why:"没有迁移脚本，数据库结构只存在于某台机器上，换环境就对不上。" });
    if (!hasA.AUTH) adv.push({ pri:"P2", tag:"安全", title:"补鉴权",
      detail:"middleware/auth 或 guard：统一做身份校验与权限判断",
      why:"鉴权逻辑散在各个 handler 里，迟早漏一个。" });
    if (!hasA.ERR) adv.push({ pri:"P2", tag:"健壮", title:"统一错误处理",
      detail:"一个全局错误中间件：把异常转成统一结构的响应，别把堆栈直接吐给调用方",
      why:"错误响应格式五花八门，调用方没法统一处理，还可能泄露内部信息。" });
    if (!d.eng.test) adv.push({ pri:"P2", tag:"工程化", title:"补测试",
      detail:"优先覆盖接口层：每个端点至少一条正常路径 + 一条异常路径",
      why:"后端改动影响面大，没测试只能靠手点接口。" });
    if (!hasA.LOG) adv.push({ pri:"P3", tag:"可观测", title:"补日志",
      detail:"结构化日志，带请求 ID，便于串联一次请求的全过程",
      why:"线上出问题没有日志，只能靠猜。" });
    // 这些是上了规模才需要的，小服务别一上来就堆
    if (!hasA.DOCKER && d.files > 8) adv.push({ pri:"P2", tag:"部署", title:"补容器化",
      detail:"Dockerfile + docker-compose.yml：把运行环境和依赖服务一起固化",
      why:"部署步骤靠人记，换台机器就跑不起来。" });
    if (!hasA.HEALTH && d.files > 12) adv.push({ pri:"P2", tag:"部署", title:"补健康检查",
      detail:"/health 端点：返回服务自身与依赖（数据库 / 缓存）的可用状态",
      why:"没有健康检查，容器编排不知道该不该重启它。" });
    if (!d.eng.ci && d.files > 12) adv.push({ pri:"P2", tag:"工程化", title:"接入 CI",
      detail:".github/workflows/ci.yml：install → lint → test → build",
      why:"没有 CI，坏代码能一路合进主分支。" });
    return sortAdv(adv);
  }

  function adviceGeneric(d){
    var adv = [], hasA = d.has;
    if (!hasA.README) adv.push({ pri:"P0", tag:"基础", title:"补 README",
      detail:"README.md：这项目是什么 + 怎么运行",
      why:"没有 README 的项目，三天后连自己都看不懂。" });
    if (!hasA.TEST) adv.push({ pri:"P2", tag:"工程化", title:"补测试",
      detail:"tests/：先覆盖核心逻辑",
      why:"改代码时没有安全网。" });
    if (!hasA.CI && d.files > 12) adv.push({ pri:"P2", tag:"工程化", title:"接入 CI",
      detail:".github/workflows/ci.yml",
      why:"没有 CI，回归只能靠手工跑。" });
    if (!hasA.LICENSE) adv.push({ pri:"P3", tag:"合规", title:"补 LICENSE",
      detail:"LICENSE 文件",
      why:"若打算公开，缺协议等于禁止他人使用。" });
    return sortAdv(adv);
  }

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  // —— 建议勾选状态：label -> [bool]，默认全选 ——
  var SEL = {};
  function initSel(label, n){
    if (!SEL[label] || SEL[label].length !== n){
      SEL[label] = [];
      for (var i=0;i<n;i++) SEL[label].push(true);
    }
  }
  function isSel(label, i){ return SEL[label] ? !!SEL[label][i] : true; }
  function resetSel(label){ delete SEL[label]; }

  var PRI_DESC = { P0:"最高优先", P1:"高", P2:"中", P3:"低" };

  // —— 把分析结果渲染成一段能直接喂给 AI 的提示词 ——
  function genPrompt(d){
    var L = [];
    L.push("# 项目结构分析：请帮我补齐缺口");
    L.push("");
    L.push("我用结构分析工具扫描了一个本地项目，下面是自动得出的结论。");
    L.push("请基于这些信息给出**具体可执行**的修复方案。");
    L.push("");
    L.push("## 一、项目概况");
    L.push("");
    L.push("- 名称：" + d.name);
    L.push("- 检测类型：" + d.type);
    L.push("- 分析模板：" + d.profileName + "（" + d.profileTag + "）");
    L.push("- 规模：" + d.files + " 个文件 / " + d.dirs + " 个目录");
    if (d.exts.length){
      L.push("- 主要文件类型：" + d.exts.map(function(e){ return "." + e.ext + " ×" + e.n; }).join("、"));
    }
    if (d.intro && d.intro.title){
      L.push("- 项目自述：" + d.intro.title + (d.intro.body ? " —— " + d.intro.body : ""));
    }
    if (d.scope){
      L.push("- 说明：这是从 " + d.root + " 里识别出的子项目，完整路径 " + d.scope);
    }

    var done = d.phases.list.filter(function(p){ return p.done; });
    var undo = d.phases.list.filter(function(p){ return !p.done; });
    L.push("");
    L.push("## 二、流程进度（" + done.length + "/" + d.phases.list.length + "）");
    L.push("");
    L.push("- 已完成：" + (done.length ? done.map(function(p){ return p.name; }).join("、") : "无"));
    L.push("- 未完成：" + (undo.length ? undo.map(function(p){ return p.name; }).join("、") : "无"));
    if (d.phases.cur >= 0){
      L.push("- 当前阶段：**" + d.phases.list[d.phases.cur].name + "**");
    }

    L.push("");
    L.push("## 三、产物齐全度");
    L.push("");
    L.push("| 产物 | 状态 | 证据 |");
    L.push("| --- | --- | --- |");
    d.artifacts.forEach(function(a){
      L.push("| " + a.label + " | " + (a.has ? "有" : "缺") + " | " + (a.evidence || "—") + " |");
    });
    L.push("");
    L.push("- CI 流水线：" + (d.eng.ci ? "有" : "缺") +
           "　测试文件：" + (d.eng.test || "缺") +
           "　README：" + (d.eng.readme ? "有" : "缺"));

    L.push("");
    L.push("## 四、需要补齐的缺口");
    L.push("");
    var picked = [];
    d.advice.forEach(function(a, i){ if (isSel(d.label, i)) picked.push(a); });
    if (!picked.length){
      L.push("（一项都没勾选，请就整体结构给出你的看法）");
    } else {
      ["P0", "P1", "P2", "P3"].forEach(function(pri){
        var grp = picked.filter(function(a){ return a.pri === pri; });
        if (!grp.length) return;
        L.push("### " + pri + "（" + PRI_DESC[pri] + "）");
        L.push("");
        grp.forEach(function(a, i){
          L.push((i + 1) + ". **" + a.title + "**　`[" + a.tag + "]`");
          L.push("   - 该做什么：" + a.detail);
          L.push("   - 为什么：" + a.why);
          L.push("");
        });
      });
    }

    L.push("## 五、我希望你做这些");
    L.push("");
    L.push("1. 针对上面每一项缺口，给出**具体要创建或修改哪些文件**、每个文件**该写什么内容**——能给草稿就给草稿，不要只说「建议补充文档」这种空话。");
    L.push("2. 如果某几项对这种规模、这种类型的项目其实不重要，直接说可以跳过，并说明理由。");
    L.push("3. 如果缺口的补齐顺序存在依赖（比如先有设计文档才好写实现），请指出先后顺序。");
    L.push("4. 给出的目录结构、命令和配置要能直接复制使用。");
    return L.join("\n");
  }

  function renderCard(d){
    var phDone = d.phases.list.filter(function(p){ return p.done; }).length;
    var h = '<div class="card" id="card-' + d.label + '">';
    h += '<div class="cname">' + esc(d.name) + '</div>';
    h += '<div class="cmeta">' + d.files + ' 个文件 · ' + d.dirs + ' 个目录</div>';
    h += '<div><span class="ptag">' + esc(d.profileName) + '</span><span class="tag hi">' + esc(d.type) + '</span>';
    d.exts.forEach(function(e){ h += '<span class="tag">.' + esc(e.ext) + ' ×' + e.n + '</span>'; });
    h += '</div>';

    if (d.intro){
      h += '<h3>项目介绍</h3><div class="intro">';
      h += '<div class="ititle">' + esc(d.intro.title) + '</div>';
      if (d.intro.body) h += '<div class="ibody">' + esc(d.intro.body) + '</div>';
      h += '<div class="isrc">来源：' +
           (d.intro.fromDoc ? '读取文档 <b>' + esc(d.intro.source) + '</b>' :
            '<b>代码结构推断</b> —— 项目里没有找到可读的说明文档') + '</div>';
      if (d.intro.tech.length){
        h += '<div style="margin-top:9px">';
        d.intro.tech.forEach(function(t){ h += '<span class="tag">' + esc(t) + '</span>'; });
        h += '</div>';
      }
      if (d.intro.modules.length){
        h += '<div class="mods">';
        d.intro.modules.forEach(function(m){
          h += '<div class="row"><i class="dot ok"></i><span class="n">' + esc(m.dir) + '</span>' +
               '<span class="v">' + esc(m.mean) + '</span></div>';
        });
        h += '</div>';
      }
      h += '</div>';
    }

    h += '<h3>阶段进度（' + esc(d.profileName) + ' · ' + esc(d.profileTag) + '）</h3><div class="phases">';
    d.phases.list.forEach(function(p){
      var cls = p.done ? "done" : (p.cur ? "cur" : "");
      h += '<div class="ph"><div class="phbox ' + cls + '" title="' + (p.evidence ? esc(p.evidence) : "无证据") + '">' + p.id + '</div><div class="phlbl">' + p.name + '</div></div>';
    });
    h += '</div>';
    var total = d.phases.list.length;
    h += '<div class="cmeta" style="margin-top:8px">已完成 ' + phDone + '/' + total + ' 阶段' + (d.phases.cur >= 0 ? ' · 当前在 <b style="color:var(--warn)">' + d.phases.list[d.phases.cur].name + '</b>' : (phDone === total ? ' · 全部阶段均有产物' : '')) + '</div>';
    h += '<div class="cmeta" style="margin-top:6px;color:var(--tx3)">分析模板：' + esc(d.profileName) +
         (d.profile !== d.auto ? '（手动指定；自动识别为「' + esc(getProfile(d.auto).name) + '」）' : '（自动识别）') + '</div>';
    if (d.files < 20 && phDone <= 1){
      h += '<div class="cmeta" style="margin-top:6px;color:var(--tx3)">这是轻量项目，未采用阶段制流程——小游戏 / 工具类项目本就不需要全套文档，阶段进度低不代表有问题。</div>';
    }

    h += '<h3>产物清点</h3>';
    d.artifacts.forEach(function(a){
      h += '<div class="row"><i class="dot ' + (a.has ? "ok" : "no") + '"></i><span class="n">' + a.label + '</span>' +
           '<span class="v">' + (a.has ? (a.count > 1 ? a.count + " 处" : "有") : "缺") + '</span></div>';
    });

    h += '<h3>工程化</h3>';
    h += '<div class="row"><i class="dot ' + (d.eng.ci ? "ok" : "no") + '"></i><span class="n">CI 流水线</span><span class="v">' + (d.eng.ci ? "有" : "缺") + '</span></div>';
    h += '<div class="row"><i class="dot ' + (d.eng.test ? "ok" : "no") + '"></i><span class="n">测试文件</span><span class="v">' + (d.eng.test || "缺") + '</span></div>';
    h += '<div class="row"><i class="dot ' + (d.eng.readme ? "ok" : "no") + '"></i><span class="n">README</span><span class="v">' + (d.eng.readme ? "有" : "缺") + '</span></div>';
    if (d.eng.pkg) h += '<div class="row"><i class="dot ok"></i><span class="n">npm scripts</span><span class="v">' + esc(d.eng.scripts.join(", ") || "无") + '</span></div>';

    var gaps = d.artifacts.filter(function(a){ return !a.has; }).map(function(a){ return a.label; });
    if (!d.eng.ci) gaps.push("CI 流水线");
    if (!d.eng.test) gaps.push("测试");
    if (gaps.length){
      h += '<div class="gaps"><b>缺口 ' + gaps.length + ' 项</b><ul>' +
           gaps.map(function(g){ return '<li>' + esc(g) + '</li>'; }).join("") + '</ul></div>';
    }

    if (d.advice && d.advice.length){
      initSel(d.label, d.advice.length);
      h += '<h3>优化建议（按优先级 · 勾选后可导出提示词）</h3>';
      h += '<div class="expbtns" style="margin-bottom:10px">' +
           '<button data-act="selall" data-label="' + d.label + '">全选</button>' +
           '<button data-act="selp01" data-label="' + d.label + '">只选 P0/P1</button>' +
           '<button data-act="selnone" data-label="' + d.label + '">全不选</button>' +
           '</div>';
      d.advice.forEach(function(a, i){
        var on = isSel(d.label, i);
        h += '<div class="adv' + (on ? '' : ' off') + '">' +
             '<input type="checkbox" class="ckbox" data-label="' + d.label + '" data-i="' + i + '"' +
             (on ? ' checked' : '') + '>' +
             '<div class="ah"><span class="pri ' + a.pri + '">' + a.pri + '</span>' +
             '<span class="atag">' + esc(a.tag) + '</span><b>' + esc(a.title) + '</b></div>' +
             '<div class="adetail">' + esc(a.detail) + '</div>' +
             '<div class="awhy">为什么：' + esc(a.why) + '</div></div>';
      });
      h += '<div class="exp">' +
           '<div class="expbtns">' +
           '<button data-act="gen" data-label="' + d.label + '">生成提示词</button>' +
           '<button data-act="copy" data-label="' + d.label + '">复制</button>' +
           '<button data-act="dl" data-label="' + d.label + '">下载 .md</button>' +
           '<span class="expcount" id="cnt-' + d.label + '">已选 ' +
             d.advice.filter(function(a, i){ return isSel(d.label, i); }).length +
             ' / ' + d.advice.length + ' 项</span>' +
           '</div>' +
           '<div class="prev hide" id="prev-' + d.label + '"></div>' +
           '</div>';
    } else {
      h += '<h3>优化建议</h3><div class="empty">该有的都有了，没查出需要补的项。</div>';
    }
    h += '</div>';
    return h;
  }

  function renderCompare(a, b){
    var h = '<div class="card cmp">';
    h += '<div class="head-row"><div class="k">对比项</div><div class="a">A · ' + esc(a.name) + '</div><div class="b">B · ' + esc(b.name) + '</div></div>';

    function row(k, va, vb, unit){
      var diff = String(va) !== String(vb);
      h += '<div class="row"><div class="k">' + k + '</div>' +
           '<div class="a">' + esc(va) + (unit||"") + '</div>' +
           '<div class="b">' + esc(vb) + (unit||"") + (diff ? '<span class="diffmark">差异</span>' : '') + '</div></div>';
    }

    row("分析模板", a.profileName, b.profileName);
    row("项目类型", a.type, b.type);
    row("文件数", a.files, b.files);
    row("目录数", a.dirs, b.dirs);
    row("完成阶段", a.phases.list.filter(function(p){return p.done;}).length + "/" + a.phases.list.length,
                    b.phases.list.filter(function(p){return p.done;}).length + "/" + b.phases.list.length);
    row("CI", a.eng.ci ? "有" : "缺", b.eng.ci ? "有" : "缺");
    row("测试文件", a.eng.test || 0, b.eng.test || 0);

    h += '<div class="head-row" style="margin-top:16px"><div class="k">产物</div><div class="a">A</div><div class="b">B</div></div>';
    getProfile(a.profile).artifacts.forEach(function(def, i){
      var x = a.artifacts[i], y = b.artifacts[i];
      var diff = x.has !== y.has;
      h += '<div class="row"><div class="k" style="color:var(--tx3);font-size:12.5px">' + def.label + '</div>' +
           '<div class="a"><i class="dot ' + (x.has?"ok":"no") + '" style="display:inline-block;margin-right:6px"></i>' + (x.has ? x.count + " 处" : "缺") + '</div>' +
           '<div class="b"><i class="dot ' + (y.has?"ok":"no") + '" style="display:inline-block;margin-right:6px"></i>' + (y.has ? y.count + " 处" : "缺") +
           (diff ? '<span class="diffmark">差异</span>' : '') + '</div></div>';
    });

    // 独有项
    var onlyA = a.artifacts.filter(function(x,i){ return x.has && !b.artifacts[i].has; }).map(function(x){ return x.label; });
    var onlyB = b.artifacts.filter(function(y,i){ return y.has && !a.artifacts[i].has; }).map(function(y){ return y.label; });
    if (onlyA.length || onlyB.length){
      h += '<div class="gaps"><b>独有产物</b><ul>';
      if (onlyA.length) h += '<li>仅 A 有：' + esc(onlyA.join("、")) + '</li>';
      if (onlyB.length) h += '<li>仅 B 有：' + esc(onlyB.join("、")) + '</li>';
      h += '</ul></div>';
    }
    h += '</div>';
    return h;
  }

  // 顶部提示：这一层到底是不是一个项目？不是的话列出子项目让用户可以切过去
  function renderBoundary(d){
    var b = d.boundary;
    if (!b || b.isSingle) return "";
    var cur = SCOPE[d.label] || null;
    var h = '<div class="bnd">';
    if (b.projects.length){
      h += '<div class="bndt">这个目录不像单个项目</div>';
      h += '<div class="bndd">' + esc(b.reason) +
           '。下面的结果是把整层当一个项目算的，可能不准——点某个子项目就只看它，不用重新选文件夹。</div>';
      h += '<div class="chips">';
      h += '<button class="chip' + (cur ? '' : ' on') + '" data-act="scope" data-which="' + d.label +
           '" data-scope=""><span class="cn">整个目录</span><span class="ck">' +
           CACHE[d.label].fileCount + ' 个文件</span></button>';
      b.projects.forEach(function(p){
        h += '<button class="chip' + (cur === p.path ? ' on' : '') + '" data-act="scope" data-which="' +
             d.label + '" data-scope="' + esc(p.path) + '"><span class="cn">' + esc(p.name) +
             '</span><span class="ck"><b>' + esc(p.kind) + '</b> · ' + p.files + ' 个文件</span></button>';
      });
      h += '</div>';
    } else {
      h += '<div class="bndt">没找到项目标志物</div>';
      h += '<div class="bndd">' + esc(b.reason) +
           '。这一层可能只是个普通文件夹（纯文档、素材、归档之类）。' +
           '如果项目在更深的目录里，直接把那一层选进来会准得多。</div>';
    }
    h += '</div>';
    return h;
  }

  // 浏览器版专属提示：告诉用户卡是因为浏览器要枚举全部文件，不是工具坏了
  function renderScale(d){
    var raw = RAW_COUNT[d.label] || 0;
    // Electron 版是按需扫描，噪音目录根本不进，不存在这个问题
    if (d.source === "electron" || raw < WARN_FILES) return "";
    var skipped = raw - d.files;
    var h = '<div class="bnd">';
    h += '<div class="bndt">' + (raw >= HARD_FILES ? "文件太多，浏览器扛得吃力" : "文件偏多") + '</div>';
    h += '<div class="bndd">浏览器一共枚举了 <b>' + raw + '</b> 个文件，其中 <b>' + skipped +
         '</b> 个落在噪音目录（node_modules / .git / dist 等）里已被跳过，实际参与分析 ' +
         d.files + ' 个。<br>' +
         '浏览器会先把目录下<b>所有</b>文件都枚举一遍才轮到分析器过滤，大目录卡的就是这一步。' +
         'exe 版走的是逐层扫描，这些目录压根不进去，会快很多。</div>';
    h += '</div>';
    return h;
  }

  function render(){
    var out = document.getElementById("out");
    if (!A && !B){ out.innerHTML = '<div class="empty">还没有选择项目目录。</div>'; return; }
    if (mode === "compare"){
      if (!A || !B){ out.innerHTML = '<div class="empty">对比模式需要同时选择项目 A 和项目 B。</div>'; return; }
      // 对比必须同模板，否则阶段与产物对不齐，没有可比性
      if (B.profile !== A.profile) B = buildData("B", A.profile, SCOPE.B);
      out.innerHTML = renderCompare(A, B);
    } else {
      var items = [A, B].filter(Boolean);
      var h = "";
      items.forEach(function(d){ h += renderScale(d) + renderBoundary(d); });
      h += '<div class="grid' + (items.length > 1 ? " two" : "") + '">' +
        items.map(renderCard).join("") + '</div>';
      out.innerHTML = h;
    }
  }

  function slotText(which, d){
    return "项目 " + which + "：<b>" + esc(d.name) + "</b> — " +
      d.files + " 文件 · " + esc(d.type) + " · 模板「" + esc(d.profileName) + "」 · 完成 " +
      d.phases.list.filter(function(p){return p.done;}).length + "/" + d.phases.list.length + " 阶段";
  }

  function updateSlots(){
    var sa = document.getElementById("slotA");
    var sb = document.getElementById("slotB");
    if (A){ sa.className = "slot loaded"; sa.innerHTML = slotText("A", A); }
    if (B){ sb.className = "slot loaded"; sb.innerHTML = slotText("B", B); }
  }

  function applyProfile(pid){
    if (A) A = buildData("A", pid || A.auto, SCOPE.A);
    if (B) B = buildData("B", pid || B.auto, SCOPE.B);
    updateSlots();
    render();
  }

  // 切换到某个子项目（scope 为空表示回到整个目录）
  function setScope(which, scope){
    SCOPE[which] = scope || null;
    resetSel(which);
    var forced = document.getElementById("selProfile").value || null;
    var d = buildData(which, forced, SCOPE[which]);
    if (!d) return;
    if (which === "A") A = d; else B = d;
    updateSlots();
    render();
  }

  var toastTimer = null;
  function toast(msg){
    var el = document.getElementById("toast");
    if (!el) return;
    el.textContent = msg;
    el.className = "toast show";
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.className = "toast"; }, 1800);
  }

  function copyText(t){
    if (navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(t).then(function(){ toast("已复制到剪贴板"); });
    }
    // file:// 下 clipboard API 可能不可用，退回到老办法
    try{
      var ta = document.createElement("textarea");
      ta.value = t;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      toast("已复制到剪贴板");
    }catch(e){
      toast("复制失败，请手动选中预览框里的文字");
    }
    return Promise.resolve();
  }

  function download(name, text){
    var blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast("已下载 " + name);
  }

  function currentData(label){ return label === "A" ? A : B; }

  function refreshPrompt(label){
    var d = currentData(label);
    if (!d) return "";
    var txt = genPrompt(d);
    var prev = document.getElementById("prev-" + label);
    if (prev){
      prev.textContent = txt;
      prev.className = "prev";
    }
    return txt;
  }

  function onLoaded(which, data, slot){
    if (!data){ slot.textContent = "这个目录没有可分析的文件"; slot.className = "slot"; return; }
    if (which === "A") A = data; else B = data;
    updateSlots();
    if (which === "B" && A) setMode("compare");
    else render();
  }

  // 浏览器路线（<input webkitdirectory>）
  function load(which, input){
    if (!input.files || !input.files.length) return;
    var slot = document.getElementById(which === "A" ? "slotA" : "slotB");
    slot.className = "slot";
    slot.textContent = "正在读取，文件多的话请稍候…";
    RAW_COUNT[which] = input.files.length;
    var forced = document.getElementById("selProfile").value || null;
    analyze(input.files, which, forced).then(function(data){
      onLoaded(which, data, slot);
    });
  }

  // Electron 路线（原生目录对话框 + 主进程扫描）
  function loadNative(which){
    var slot = document.getElementById(which === "A" ? "slotA" : "slotB");
    slot.className = "slot";
    slot.textContent = "正在扫描目录…";
    var forced = document.getElementById("selProfile").value || null;
    analyzeNative(which, forced).then(function(data){
      onLoaded(which, data, slot);
    });
  }

  function pickDir(which){
    if (HAS_NATIVE) loadNative(which);
    else document.getElementById(which === "A" ? "fa" : "fb").click();
  }

  function setMode(m){
    mode = m;
    document.getElementById("mSingle").className = (m === "single" ? "on" : "");
    document.getElementById("mCompare").className = (m === "compare" ? "on" : "");
    render();
  }

  document.getElementById("btnA").onclick = function(){ pickDir("A"); };
  document.getElementById("btnB").onclick = function(){ pickDir("B"); };
  document.getElementById("fa").onchange = function(){ load("A", this); };
  document.getElementById("fb").onchange = function(){ load("B", this); };
  document.getElementById("mSingle").onclick = function(){ setMode("single"); };
  document.getElementById("mCompare").onclick = function(){ setMode("compare"); };
  document.getElementById("btnClear").onclick = function(){
    A = null; B = null; CACHE = {};
    document.getElementById("fa").value = "";
    document.getElementById("fb").value = "";
    document.getElementById("selProfile").value = "";
    document.getElementById("slotA").className = "slot";
    document.getElementById("slotA").textContent = "项目 A：未选择";
    document.getElementById("slotB").className = "slot";
    document.getElementById("slotB").textContent = "项目 B：未选择（对比模式需要）";
    SCOPE.A = null; SCOPE.B = null;
    RAW_COUNT.A = 0; RAW_COUNT.B = 0;
    SEL = {};
    setMode("single");
  };

  // 卡片里的按钮和勾选框都是 render 出来的，用事件委托统一处理
  var outEl = document.getElementById("out");
  outEl.addEventListener("click", function(e){
    var btn = e.target.closest ? e.target.closest("button[data-act]") : null;
    if (!btn) return;
    var act = btn.getAttribute("data-act");
    var label = btn.getAttribute("data-label");
    var which = btn.getAttribute("data-which");

    if (act === "scope"){ setScope(which, btn.getAttribute("data-scope")); return; }

    var d = currentData(label);
    if (!d) return;
    if (act === "selall" || act === "selnone" || act === "selp01"){
      for (var i=0;i<d.advice.length;i++){
        SEL[label][i] = act === "selall" ? true
                      : act === "selnone" ? false
                      : (d.advice[i].pri === "P0" || d.advice[i].pri === "P1");
      }
      render();
      refreshPromptIfOpen(label);
      return;
    }
    if (act === "gen"){ refreshPrompt(label); toast("提示词已生成"); return; }
    if (act === "copy"){ copyText(genPrompt(d)); return; }
    if (act === "dl"){
      download("项目分析-" + d.name + ".md", genPrompt(d));
      return;
    }
  });

  outEl.addEventListener("change", function(e){
    var cb = e.target;
    if (!cb.classList || !cb.classList.contains("ckbox")) return;
    var label = cb.getAttribute("data-label");
    var i = +cb.getAttribute("data-i");
    if (!SEL[label]) return;
    SEL[label][i] = cb.checked;
    cb.parentNode.className = "adv" + (cb.checked ? "" : " off");
    var cnt = document.getElementById("cnt-" + label);
    if (cnt){
      var n = SEL[label].filter(Boolean).length;
      cnt.textContent = "已选 " + n + " / " + SEL[label].length + " 项";
    }
    refreshPromptIfOpen(label);
  });

  // 预览框已经打开的话，勾选变化后跟着刷新
  function refreshPromptIfOpen(label){
    var prev = document.getElementById("prev-" + label);
    if (prev && prev.className === "prev") refreshPrompt(label);
  }

  // 模板下拉框
  var selP = document.getElementById("selProfile");
  PROFILE_ORDER.forEach(function(id){
    var p = PROFILES[id];
    var op = document.createElement("option");
    op.value = id;
    op.textContent = p.name + " · " + p.tag;
    selP.appendChild(op);
  });
  selP.onchange = function(){ applyProfile(this.value); };

  window.__PA = {
    analyze: analyze, buildData: buildData,
    detectType: detectType, detectProfile: detectProfile,
    detectProjects: detectProjects, scoreDir: scoreDir,
    genPrompt: genPrompt, MANIFEST: MANIFEST, PROJECT_MIN: PROJECT_MIN,
    PROFILE_ORDER: PROFILE_ORDER, serverScore: serverScore, hasFrontendSignal: hasFrontendSignal,
    analyzeEntries: analyzeEntries, readTexts: readTexts,
    // 下划线前缀 = 给测试用的内部接口
    _setSel: function(label, arr){ SEL[label] = arr; },
    detectPhases: detectPhases, detectArtifacts: detectArtifacts,
    detectEngineering: detectEngineering, genIntro: genIntro, inferModules: inferModules,
    PROFILES: PROFILES, getProfile: getProfile
  };
  render();
})();
</script>
</body>
</html>
